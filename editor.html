<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kennedy Concession Menu Editor</title>
<style>body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#f5f7fb;color:#10213d}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #dfe5ef;border-radius:14px;padding:18px;margin-bottom:16px}h1{margin-top:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{display:block;font-weight:700;font-size:14px}input,textarea{width:100%;padding:10px;border:1px solid #b8c2d3;border-radius:8px;margin-top:5px;font:inherit}.cat{border-top:1px solid #e5e9f0;padding-top:12px;margin-top:12px}.row{display:grid;grid-template-columns:1.5fr .55fr 1.2fr 1.5fr auto;gap:8px;align-items:end;margin:7px 0}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:none;background:#0b2f6b;color:#fff;padding:11px 16px;border-radius:9px;font-weight:700;cursor:pointer}.btn.alt{background:#68758a}.btn.warn{background:#a33}.hint{font-size:13px;color:#5c687b}.preview{display:inline-block;margin-top:8px;color:#0b2f6b;font-weight:700}@media(max-width:720px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}.row .desc{grid-column:1/-1}}</style></head>
<body><div class="wrap"><h1>Kennedy Concession Menu Editor</h1><p class="hint">Edit the menu, save it on this device, or export a shareable TV link. For GitHub Pages, use the generated link on the Fire TV.</p>
<div class="card"><div class="grid"><label>Title<input id="title"></label><label>Subtitle<input id="subtitle"></label><label>Banner<input id="banner"></label><label>Hours<input id="hours"></label><label>Benefit text<input id="benefit"></label><label>Motto<input id="motto"></label><label>Logo image URL<input id="logo" placeholder="https://..."></label></div></div>
<div id="cats"></div>
<div class="card"><h2>Right-side panels</h2><div id="panels"></div></div>
<div class="card"><div class="actions"><button class="btn" id="save">Save on this device</button><button class="btn" id="link">Create TV link</button><button class="btn alt" id="export">Export JSON</button><label class="btn alt">Import JSON<input id="import" type="file" accept="application/json" style="display:none"></label><button class="btn warn" id="reset">Reset</button></div><a id="preview" class="preview" href="index.html" target="_blank">Open TV preview</a><textarea id="share" rows="4" placeholder="Generated TV link will appear here"></textarea></div>
</div>
<script>
const defaults={title:'KENNEDY',subtitle:'FOOTBALL CONCESSIONS',banner:'★ SUPPORT OUR TEAM. SUPPORT OUR COMMUNITY. ★',benefit:'KENNEDY FOOTBALL',motto:'ONE TEAM. ONE COMMUNITY.',hours:'CONCESSIONS OPEN 1 HOUR BEFORE KICKOFF',logo:'',categories:[{name:'HOT FOOD',items:[['Hot Dog','3.00','','','','🌭'],['Nachos','4.00','','','','🧀'],['Popcorn','2.00','','','','🍿']]},{name:'SNACKS',items:[['Chips','1.00','','','','🥔'],['Pickle','1.00','','','','🥒']]},{name:'CANDY',items:[['Candy Bars','2.00','','','','🍫'],['Ring Pops','1.00','','','','💍'],['Cotton Candy','3.00','','','','🍬']]},{name:'DRINKS',items:[['Water','2.00','','','','💧'],['Soda','2.00','','','','🥤'],['Bubblr','4.00','','','','🫧']]}],sidePanels:[{title:'GAME DAY FUEL',text:'THANK YOU FOR SUPPORTING KENNEDY FOOTBALL!'},{title:'PAYMENT OPTIONS',text:'CASH • CARD • VENMO',qr:''},{title:'GAME DAY PROGRAM',text:"SCAN TO VIEW TODAY'S DIGITAL GAME DAY PROGRAM!",qr:''}]};
let data;try{data=JSON.parse(localStorage.getItem('kennedyMenu'))||structuredClone(defaults)}catch(e){data=structuredClone(defaults)}
const $=s=>document.querySelector(s);function build(){['title','subtitle','banner','hours','benefit','motto','logo'].forEach(k=>$('#'+k).value=data[k]||'');const cats=$('#cats');cats.innerHTML='';data.categories.forEach((c,ci)=>{const card=document.createElement('div');card.className='card';card.innerHTML=`<h2>Category ${ci+1}</h2><label>Category name<input class="catname" value="${c.name}"></label><div class="cat"></div><button class="btn alt add">Add item</button>`;card.querySelector('.catname').addEventListener('input',e=>c.name=e.target.value);const list=card.querySelector('.cat');function rows(){list.innerHTML='';c.items.forEach((i,ii)=>{const r=document.createElement('div');r.className='row';r.innerHTML=`<label>Item<input value="${i[0]||''}"></label><label>Price<input value="${i[1]||''}"></label><label class="desc">Description<input value="${i[2]||''}"></label><label class="desc">Image URL (optional)<input value="${i[4]||''}" placeholder="https://..."></label><label>Sold out<input type="checkbox" ${i[3]?'checked':''}></label>`;const ins=r.querySelectorAll('input');ins[0].oninput=e=>i[0]=e.target.value;ins[1].oninput=e=>i[1]=e.target.value;ins[2].oninput=e=>i[2]=e.target.value;ins[3].oninput=e=>i[4]=e.target.value;ins[4].onchange=e=>i[3]=e.target.checked;list.appendChild(r)});} rows();card.querySelector('.add').onclick=()=>{c.items.push(['','0.00','','','','⭐']);rows()};cats.appendChild(card)});const p=$('#panels');p.innerHTML='';data.sidePanels.forEach((x,pi)=>{const r=document.createElement('div');r.className='row';r.innerHTML=`<label>Panel title<input value="${x.title||''}"></label><label class="desc">Text<input value="${x.text||''}"></label><label class="desc">QR image URL<input value="${x.qr||''}"></label>`;const ins=r.querySelectorAll('input');ins[0].oninput=e=>x.title=e.target.value;ins[1].oninput=e=>x.text=e.target.value;ins[2].oninput=e=>x.qr=e.target.value;p.appendChild(r)})}
function syncTop(){['title','subtitle','banner','hours','benefit','motto','logo'].forEach(k=>data[k]=$('#'+k).value)}
$('#save').onclick=()=>{syncTop();localStorage.setItem('kennedyMenu',JSON.stringify(data));localStorage.setItem('kennedyMenuUpdated',Date.now());alert('Saved on this device.')}
$('#link').onclick=()=>{syncTop();const enc=btoa(encodeURIComponent(JSON.stringify(data)));const base=new URL('index.html',location.href);base.searchParams.set('data',enc);$('#share').value=base.href;$('#preview').href=base.href}
$('#export').onclick=()=>{syncTop();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kennedy-concession-menu.json';a.click();URL.revokeObjectURL(a.href)}
$('#import').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{data=JSON.parse(r.result);build()};r.readAsText(f)}
$('#reset').onclick=()=>{data=structuredClone(defaults);localStorage.removeItem('kennedyMenu');build()};build();
</script></body></html>
