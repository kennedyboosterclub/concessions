<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kennedy Concessions</title>
<style>
:root{--navy:#021526;--navy2:#06223a;--gold:#f2a900;--gold2:#ffc400;--white:#f7f3ea;--muted:#dbe5ef}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}body{display:flex;align-items:center;justify-content:center;font-family:Impact,Haettenschweiler,'Arial Narrow Bold',Arial,sans-serif;color:var(--white)}
.board{position:relative;width:min(100vw,177.7778vh);aspect-ratio:16/9;background:radial-gradient(circle at 50% -15%,#0b3758 0,#031d31 33%,#01111e 72%,#000b13 100%);overflow:hidden;display:grid;grid-template-rows:20.5% 58.5% 15.5% 5.5%;border:10px solid #02080d}
.board:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,.02),transparent 20%,transparent 80%,rgba(255,255,255,.02));z-index:0}.header,.main,.meals,.footer{position:relative;z-index:1;min-width:0;min-height:0}
.lights{position:absolute;top:2.2%;width:8.2%;height:8%;opacity:.95;filter:drop-shadow(0 0 12px #d9f3ff);z-index:2;background:radial-gradient(circle,#fff 0 18%,transparent 22%) 0 0/33% 50%}.lights.left{left:2%}.lights.right{right:2%}
.logo{position:absolute;top:2.8%;width:8.2%;height:13%;object-fit:contain;z-index:3}.logo.left{left:7.5%}.logo.right{right:7.5%}
.header{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-top:.4%}.title{font-size:5.2vw;max-font-size:96px;letter-spacing:.18vw;color:var(--gold);-webkit-text-stroke:.11vw #fff;text-shadow:0 .2vw 0 #5d3300,0 .38vw .6vw #000;line-height:.78}.subtitle{font-size:4.4vw;letter-spacing:.1vw;color:#f3efe8;text-shadow:0 .28vw 0 #111;line-height:.82;margin-top:.2%}.tagline{margin-top:.7%;min-width:42%;max-width:70%;background:linear-gradient(90deg,transparent 0,var(--gold) 10%,var(--gold2) 50%,var(--gold) 90%,transparent 100%);color:#111;padding:.35% 4%;font-size:1.45vw;letter-spacing:.04vw;white-space:nowrap}
.main{display:grid;grid-template-columns:30% 23.5% 23.5% 23%;gap:.65%;padding:.2% 1.1% .35%}.panel,.smallbox,.meal{background:linear-gradient(180deg,rgba(4,31,51,.97),rgba(1,19,33,.98));border:.18vw solid var(--gold);border-radius:.8vw;min-width:0;min-height:0;overflow:hidden}.panel{padding:.45vw .55vw}.section-title{text-align:center;color:#111;background:var(--gold);font-size:1.75vw;padding:.05vw .9vw .08vw;margin:-.1vw auto .28vw;width:max-content;max-width:94%;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);letter-spacing:.03vw;white-space:nowrap}
.items{height:calc(100% - 2.4vw);display:grid;min-height:0}.hot-items{height:calc(100% - 2.4vw);display:grid;grid-auto-rows:minmax(0,1fr);--count:5}.hot-item,.dark-item,.candy-item{min-height:0}.hot-item{display:grid;grid-template-columns:28% minmax(0,1fr) auto;align-items:center;gap:.45vw;border-bottom:.09vw solid rgba(242,169,0,.65);padding:.08vw .15vw}.hot-item:last-child,.dark-item:last-child,.candy-item:last-child{border-bottom:0}.hot-item img{width:100%;height:100%;max-height:min(4.05vw,calc(21vw / var(--count)));object-fit:contain}.name{font-size:clamp(.68vw,calc(7.2vw / var(--count)),1.5vw);line-height:.92;min-width:0}.price{font-size:clamp(.9vw,calc(8.8vw / var(--count)),1.9vw);color:var(--gold);line-height:1}.hot-item .price{background:var(--gold);color:#111;padding:.06vw .38vw;clip-path:polygon(8% 0,100% 10%,92% 100%,0 90%)}.hot-text{min-width:0;align-self:center}.hot-desc{font-family:Arial,sans-serif;font-size:clamp(.62vw,calc(3.35vw / var(--count)),.82vw);font-weight:700;line-height:1.08;margin-top:.12vw;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dark-list{height:calc(100% - 2.4vw);display:grid;grid-auto-rows:minmax(0,1fr);--count:4}.dark-item{display:grid;grid-template-columns:22% minmax(0,1fr) auto;align-items:center;gap:.42vw;border-bottom:.09vw dotted rgba(242,169,0,.9);padding:.1vw .05vw}.dark-item img{width:100%;height:100%;max-height:min(3.65vw,calc(17vw / var(--count)));object-fit:contain}.dark-item .name{font-size:clamp(.74vw,calc(5.4vw / var(--count)),1.25vw)}.desc{font-family:Arial,sans-serif;font-size:clamp(.60vw,calc(3.25vw / var(--count)),.80vw);font-weight:700;line-height:1.08;margin-top:.08vw;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.dark-item .price{font-size:clamp(.9vw,calc(6.2vw / var(--count)),1.55vw)}.stack{display:grid;grid-template-rows:1fr .96fr;gap:.55vw;min-width:0;min-height:0}.stack>.panel{min-height:0}.candy-list{height:calc(100% - 2.4vw);display:grid;grid-auto-rows:minmax(0,1fr);--count:3}.candy-item{display:grid;grid-template-columns:25% minmax(0,1fr) auto;align-items:center;gap:.42vw;border-bottom:.09vw dotted rgba(242,169,0,.9);padding:.08vw .08vw}.candy-item img{width:100%;height:100%;max-height:min(4.1vw,calc(19vw / var(--count)));object-fit:contain}.candy-item .name{font-size:clamp(.76vw,calc(5.3vw / var(--count)),1.32vw)}.candy-text{min-width:0}.candy-desc{font-family:Arial,sans-serif;font-size:clamp(.68vw,calc(3.9vw / var(--count)),.92vw);font-weight:700;line-height:1.1;margin-top:.07vw;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.candy-item .price{font-size:clamp(.95vw,calc(6.2vw / var(--count)),1.58vw)}
.side{display:grid;grid-template-rows:minmax(0,1fr) auto auto;gap:.5vw;min-width:0;min-height:0}.breakfast-list{height:calc(100% - 2.4vw);display:grid;grid-auto-rows:minmax(0,1fr);--count:2}.stack .breakfast-list .dark-item img{max-height:min(2.85vw,calc(10vw / var(--count)))}.stack .breakfast-list .dark-item .name{font-size:clamp(.72vw,calc(4.7vw / var(--count)),1.16vw)}.stack .breakfast-list .desc{font-size:clamp(.62vw,calc(3.3vw / var(--count)),.78vw)}.smallbox{border-radius:.6vw}.smallbox h3{margin:0;background:var(--gold);color:#111;text-align:center;padding:.2vw .25vw;font-size:.95vw;line-height:1}.smallbox .inside{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:.35vw;padding:.28vw .45vw;font-family:Arial,sans-serif;font-weight:800;font-size:.7vw;line-height:1.08}.qr{width:3.6vw;height:3.6vw;background:#fff;padding:.14vw;object-fit:contain}.hidden{display:none!important}
.meals{display:grid;grid-template-columns:repeat(var(--meal-count,2),minmax(0,1fr));gap:.65%;padding:.05% 1.1% .25%;--meal-count:2}.meal{display:grid;grid-template-columns:28% minmax(0,1fr) 24%;align-items:center;gap:.42vw;padding:.35vw .5vw}.meal-name{font-size:clamp(.88vw,calc(3.1vw / var(--meal-count)),1.6vw);line-height:.9}.meal-price{display:inline-block;margin-top:.16vw;font-size:clamp(1.25vw,calc(4vw / var(--meal-count)),2.05vw);color:#111;background:var(--gold);padding:.04vw .48vw;line-height:1}.meal-desc{font-family:Arial,sans-serif;font-weight:900;font-size:clamp(.58vw,calc(1.65vw / var(--meal-count)),.78vw);line-height:1.08;text-transform:uppercase;color:var(--white);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.meal img{width:100%;height:clamp(3.7vw,calc(13vw / var(--meal-count)),6.5vw);object-fit:contain}.footer{display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.35vw;font-style:italic;letter-spacing:.03vw}.footer b{color:var(--gold);margin-left:.35vw}
@media (max-width:1100px){.board{border-width:6px}.title{font-size:5.2vw}.subtitle{font-size:4.4vw}}
</style>
</head>
<body>
<div class="board">
  <div class="lights left"></div><div class="lights right"></div>
  <img class="logo left" src="assets/logo-left.png" alt="Kennedy Eagles logo"><img class="logo right" src="assets/logo-left.png" alt="Kennedy Eagles logo">
  <div class="header"><div class="title" id="title"></div><div class="subtitle" id="subtitle"></div><div class="tagline" id="tagline"></div></div>
  <div class="main">
    <section class="panel"><div class="section-title">HOT FOOD</div><div id="hotFood" class="hot-items"></div></section>
    <section class="panel"><div class="section-title">DRINKS</div><div id="drinks" class="dark-list"></div></section>
    <div class="stack"><section class="panel"><div class="section-title">SNACKS</div><div id="snacks" class="dark-list"></div></section><section class="panel"><div class="section-title">BREAKFAST</div><div id="breakfast" class="dark-list breakfast-list"></div></section></div>
    <aside class="side"><section class="panel candy-panel"><div class="section-title">CANDY</div><div id="candy" class="candy-list"></div></section><section class="smallbox" id="paymentBox"><h3>PAYMENT OPTIONS</h3><div class="inside"><div id="payments"></div><img id="paymentQr" class="qr hidden" alt="Payment QR"></div></section><section class="smallbox" id="programBox"><h3>GAME DAY PROGRAM</h3><div class="inside"><div id="programText"></div><img id="programQr" class="qr hidden" alt="Program QR"></div></section></aside>
  </div>
  <div class="meals" id="meals"></div>
  <div class="footer" id="footer"></div>
</div>
<script>
function loadMenuData(){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='menu-data.js?v='+Date.now();s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
(async()=>{try{await loadMenuData()}catch(e){}
try{const q=localStorage.getItem('kennedyPreviewData');if(new URLSearchParams(location.search).has('preview')&&q)window.KENNEDY_MENU=JSON.parse(q)}catch(e){}
const d=window.KENNEDY_MENU||{};const $=id=>document.getElementById(id);
if((d.schemaVersion||0)<9){d.breakfast=Array.isArray(d.breakfast)?d.breakfast:[];d.snacks=Array.isArray(d.snacks)?d.snacks:[];const u=d.snacks.find(i=>/UNCRUSTABLE/i.test(i.name||''));if(u&&!d.breakfast.some(i=>/UNCRUSTABLE/i.test(i.name||''))){d.breakfast.push(u);d.snacks=d.snacks.filter(i=>i!==u)}if(!d.breakfast.some(i=>/DONUT/i.test(i.name||'')))d.breakfast.push({name:'DONUTS',price:'2',image:'assets/donuts.svg'});d.drinks=Array.isArray(d.drinks)?d.drinks:[];if(!d.drinks.some(i=>/COFFEE/i.test(i.name||'')))d.drinks.push({name:'COFFEE',price:'2',image:'assets/coffee.svg'});if(!d.drinks.some(i=>/RED BULL/i.test(i.name||'')))d.drinks.push({name:'RED BULL',price:'4',image:'assets/redbull.svg'});d.schemaVersion=9;}
$('title').textContent=d.title||'KENNEDY';$('subtitle').textContent=d.subtitle||'CONCESSIONS';$('tagline').textContent=d.tagline||'';
const footer=d.footer||'ALL PROCEEDS SUPPORT OUR FOOTBALL ATHLETES!';$('footer').innerHTML=esc(footer).replace(/(OUR FOOTBALL ATHLETES!)/i,'<b>$1</b>');
function available(items){return (items||[]).filter(i=>!i.outOfStock)}
function applyCount(el,count){el.style.setProperty('--count',Math.max(1,count));el.style.gridTemplateRows=`repeat(${Math.max(1,count)},minmax(0,1fr))`}
function hot(items){const list=available(items),el=$('hotFood');applyCount(el,list.length);el.innerHTML=list.map(i=>`<div class="hot-item"><img src="${esc(i.image||'')}" alt=""><div class="hot-text"><div class="name">${esc(i.name||'')}</div>${i.description?`<div class="hot-desc">${esc(i.description)}</div>`:''}</div><div class="price">$${esc(i.price||'')}</div></div>`).join('')}
function dark(id,items){const list=available(items),el=$(id);applyCount(el,list.length);el.innerHTML=list.map(i=>`<div class="dark-item"><img src="${esc(i.image||'')}" alt=""><div><div class="name">${esc(i.name||'')}</div>${i.description?`<div class="desc">${esc(i.description)}</div>`:''}</div><div class="price">$${esc(i.price||'')}</div></div>`).join('')}
function candy(items){const list=available(items),el=$('candy');applyCount(el,list.length);el.innerHTML=list.map(i=>`<div class="candy-item"><img src="${safeImg(i.image)}" alt=""><div class="candy-text"><div class="name">${esc(i.name||'')}</div>${i.description?`<div class="candy-desc">${esc(i.description)}</div>`:''}</div><div class="price">$${esc(i.price||'')}</div></div>`).join('')}
function meals(items){const list=available(items).slice(0,3),el=$('meals');el.style.setProperty('--meal-count',Math.max(1,list.length));el.innerHTML=list.map(i=>`<section class="meal"><div><div class="meal-name">${esc(i.name||'')}</div><div class="meal-price">$${esc(i.price||'')}</div></div><div class="meal-desc">INCLUDES:<br>${esc(i.description||'')}</div><img src="${esc(i.image||'')}" alt=""></section>`).join('')}
hot(d.hotFood);dark('drinks',d.drinks);dark('snacks',d.snacks);dark('breakfast',d.breakfast);candy(d.candy);meals(d.meals);
$('payments').textContent=d.payments||'';$('programText').textContent=d.programText||'';$('paymentBox').classList.toggle('hidden',d.showPayments===false);$('programBox').classList.toggle('hidden',d.showProgram===false);
if(d.paymentQr){$('paymentQr').src=d.paymentQr;$('paymentQr').classList.remove('hidden')}if(d.programQr){$('programQr').src=d.programQr;$('programQr').classList.remove('hidden')}
})();
</script>
</body></html>
