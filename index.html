<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kennedy Football Concessions</title>
<style>
:root{--navy:#071a3d;--blue:#0b2f6b;--gold:#f6c500;--white:#fff;--muted:#c8d3e6}
*{box-sizing:border-box}body{margin:0;background:var(--navy);color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
.screen{width:100vw;height:100vh;display:grid;grid-template-rows:auto auto 1fr auto;background:radial-gradient(circle at 50% 0,#123d7d 0,#071a3d 48%,#041127 100%)}
header{display:flex;align-items:center;justify-content:center;gap:24px;padding:10px 22px 5px;text-align:center}.logo{width:84px;height:84px;object-fit:contain;display:none}
.brand h1{margin:0;font-size:clamp(42px,4.8vw,82px);letter-spacing:3px;color:var(--gold);text-shadow:0 2px 0 #fff,0 5px 0 #071a3d}.brand h2{margin:0;font-size:clamp(20px,2vw,36px);letter-spacing:6px}
.banner{background:var(--gold);color:var(--navy);font-weight:900;text-align:center;padding:7px 16px;font-size:clamp(17px,1.55vw,29px);letter-spacing:1px}
.main{display:grid;grid-template-columns:repeat(4,1fr) 1.05fr;gap:12px;padding:12px 18px 8px;min-height:0}
.cat{border-right:2px solid var(--gold);padding-right:12px;min-width:0;display:flex;flex-direction:column}.cat h3{margin:0 0 7px;font-size:clamp(22px,1.8vw,34px);font-style:italic;border-bottom:3px solid var(--gold);padding-bottom:5px}
.items{display:grid;gap:6px}.item{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:clamp(15px,1.2vw,24px);font-weight:800;padding:3px 0}.item .name{min-width:0}.item .price{color:var(--gold);white-space:nowrap}.item small{display:block;color:var(--muted);font-size:.62em;font-weight:400;margin-top:1px}.sold{opacity:.35;text-decoration:line-through}
.thumb{width:50px;height:50px;border-radius:12px;background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:34px;line-height:1}.thumb img{width:100%;height:100%;object-fit:contain;background:#fff}
.hero{margin-top:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding-top:8px}.hero .thumb{width:100%;height:auto;aspect-ratio:1;border-radius:14px;font-size:clamp(34px,3vw,60px);background:rgba(255,255,255,.08)}
.side{display:grid;gap:10px;align-content:start}.panel{border:3px solid var(--gold);border-radius:13px;overflow:hidden;background:rgba(7,26,61,.9)}.panel h4{margin:0;background:var(--gold);color:var(--navy);padding:6px 10px;text-align:center;font-size:clamp(17px,1.35vw,25px)}.panel .body{padding:10px;text-align:center;font-size:clamp(13px,1vw,20px);font-weight:700}.qr{width:min(125px,70%);aspect-ratio:1;background:#fff;margin:7px auto 0;border-radius:7px;padding:5px}.qr img{width:100%;height:100%;object-fit:contain}
footer{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-top:2px solid rgba(255,255,255,.35);font-size:clamp(14px,1.25vw,24px)}footer>div{padding:9px 16px}.benefit{font-weight:900}.benefit span{color:var(--gold)}.motto{text-align:center;font-weight:900;letter-spacing:2px}.hours{background:var(--gold);color:var(--navy);font-weight:900;text-align:center}
@media(max-width:1100px){.main{gap:8px;padding-left:10px;padding-right:10px}.cat{padding-right:7px}.item{grid-template-columns:42px minmax(0,1fr) auto}.thumb{width:40px;height:40px;font-size:28px}.brand h2{letter-spacing:3px}}
</style>
</head>
<body><div class="screen">
<header><img id="leftLogo" class="logo" alt="Kennedy logo"><div class="brand"><h1 id="title">KENNEDY</h1><h2 id="subtitle">FOOTBALL CONCESSIONS</h2></div><img id="rightLogo" class="logo" alt="Kennedy logo"></header>
<div class="banner" id="banner">★ SUPPORT OUR TEAM. SUPPORT OUR COMMUNITY. ★</div>
<div class="main" id="menuGrid"></div>
<footer><div class="benefit">ALL PROCEEDS BENEFIT <span id="benefit">KENNEDY FOOTBALL</span></div><div class="motto" id="motto">ONE TEAM. ONE COMMUNITY.</div><div class="hours" id="hours">CONCESSIONS OPEN 1 HOUR BEFORE KICKOFF</div></footer>
</div>
<script>
const defaultMenu={title:'KENNEDY',subtitle:'FOOTBALL CONCESSIONS',banner:'★ SUPPORT OUR TEAM. SUPPORT OUR COMMUNITY. ★',benefit:'KENNEDY FOOTBALL',motto:'ONE TEAM. ONE COMMUNITY.',hours:'CONCESSIONS OPEN 1 HOUR BEFORE KICKOFF',logo:'',categories:[
{name:'HOT FOOD',items:[['Hot Dog','3.00','','', '', '🌭'],['Nachos','4.00','','','', '🧀'],['Popcorn','2.00','','','', '🍿']]},
{name:'SNACKS',items:[['Chips','1.00','','','', '🥔'],['Pickle','1.00','','','', '🥒']]},
{name:'CANDY',items:[['Candy Bars','2.00','','','', '🍫'],['Ring Pops','1.00','','','', '💍'],['Cotton Candy','3.00','','','', '🍬']]},
{name:'DRINKS',items:[['Water','2.00','','','', '💧'],['Soda','2.00','','','', '🥤'],['Bubblr','4.00','','','', '🫧']]}
],sidePanels:[{title:'GAME DAY FUEL',text:'THANK YOU FOR SUPPORTING KENNEDY FOOTBALL!'},{title:'PAYMENT OPTIONS',text:'CASH • CARD • VENMO',qr:''},{title:'GAME DAY PROGRAM',text:"SCAN TO VIEW TODAY'S DIGITAL GAME DAY PROGRAM!",qr:''}]};
function getMenu(){try{const q=new URLSearchParams(location.search).get('data');if(q)return JSON.parse(decodeURIComponent(atob(q)))}catch(e){}try{const x=localStorage.getItem('kennedyMenu');if(x)return JSON.parse(x)}catch(e){}return defaultMenu}
function fallbackIcon(name){const n=(name||'').toLowerCase();if(n.includes('hot dog'))return'🌭';if(n.includes('nacho'))return'🧀';if(n.includes('popcorn'))return'🍿';if(n.includes('chip'))return'🥔';if(n.includes('pickle'))return'🥒';if(n.includes('candy bar'))return'🍫';if(n.includes('ring'))return'💍';if(n.includes('cotton'))return'🍬';if(n.includes('water'))return'💧';if(n.includes('soda'))return'🥤';if(n.includes('bubblr'))return'🫧';return'⭐'}
function thumbHTML(item,big=false){const name=item[0]||'',url=item[4]||'',icon=item[5]||fallbackIcon(name);return `<div class="thumb${big?' big':''}">${url?`<img src="${url}" alt="${name}" onerror="this.parentElement.textContent='${icon}'">`:icon}</div>`}
function render(){const m=getMenu();['title','subtitle','banner','benefit','motto','hours'].forEach(k=>document.getElementById(k).textContent=m[k]||'');['leftLogo','rightLogo'].forEach(id=>{const el=document.getElementById(id);if(m.logo){el.src=m.logo;el.style.display='block'}else el.style.display='none'});
const grid=document.getElementById('menuGrid');grid.innerHTML='';(m.categories||[]).forEach(c=>{const s=document.createElement('section');s.className='cat';s.innerHTML=`<h3>${c.name}</h3><div class="items"></div><div class="hero"></div>`;const list=s.querySelector('.items');(c.items||[]).forEach(i=>{const [name,price,desc,sold]=i;const d=document.createElement('div');d.className='item'+(sold?' sold':'');d.innerHTML=`${thumbHTML(i)}<div class="name">${name}${desc?`<small>${desc}</small>`:''}</div><div class="price">$${price}</div>`;list.appendChild(d)});const hero=s.querySelector('.hero');(c.items||[]).slice(0,3).forEach(i=>{hero.insertAdjacentHTML('beforeend',thumbHTML(i,true))});grid.appendChild(s)});
const side=document.createElement('aside');side.className='side';(m.sidePanels||[]).forEach(p=>{const box=document.createElement('div');box.className='panel';box.innerHTML=`<h4>${p.title}</h4><div class="body"><div>${p.text||''}</div>${p.qr?`<div class="qr"><img src="${p.qr}" alt="QR code"></div>`:''}</div>`;side.appendChild(box)});grid.appendChild(side)}
render();setInterval(()=>{try{const t=localStorage.getItem('kennedyMenuUpdated');if(t&&t!==window.lastT){window.lastT=t;render()}}catch(e){}},2000)
</script></body></html>
