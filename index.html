<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Kennedy Concessions</title>
<style>
:root{--navy:#021526;--navy2:#06223a;--gold:#f2a900;--gold2:#ffc400;--white:#f7f3ea;--muted:#dbe5ef}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}body{display:flex;align-items:center;justify-content:center;font-family:Impact,Haettenschweiler,'Arial Narrow Bold',Arial,sans-serif;color:var(--white)}
.board{position:relative;width:min(100vw,177.7778vh);aspect-ratio:16/9;background:radial-gradient(circle at 50% -15%,#0b3758 0,#031d31 33%,#01111e 72%,#000b13 100%);overflow:hidden;display:grid;grid-template-rows:12.5% 56% 15.5% 16%;border:.52vw solid #02080d}
.board:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,.02),transparent 20%,transparent 80%,rgba(255,255,255,.02));z-index:0}.header,.main,.meals,.sponsors{position:relative;z-index:1;min-width:0;min-height:0}
.header{display:flex;align-items:center;justify-content:center;padding:0 11.5%;position:relative}.logo-left{position:absolute;left:2.1%;top:8%;width:8.1%;height:84%;object-fit:contain}.support-top{position:absolute;right:2.2%;top:20%;width:23%;text-align:right;font-size:1.18vw;line-height:.96;letter-spacing:.02vw;text-shadow:0 .1vw .18vw rgba(0,0,0,.65)}.support-top b{display:block;color:var(--gold);font-size:1.33vw;margin-top:.10vw}
.header-center{text-align:center;min-width:0;width:58%;padding-top:.1vw}.title-line{font-size:3.95vw;letter-spacing:.11vw;color:var(--gold);-webkit-text-stroke:.085vw #fff;text-shadow:0 .15vw 0 #5d3300,0 .28vw .45vw #000;line-height:.88;white-space:nowrap}.title-line .second{color:#f3efe8}.tagline{margin:.44vw auto 0;width:88%;background:linear-gradient(90deg,transparent 0,var(--gold) 10%,var(--gold2) 50%,var(--gold) 90%,transparent 100%);color:#111;padding:.18vw 2vw;font-size:1.02vw;letter-spacing:.035vw;white-space:nowrap;line-height:1}
.main{display:grid;grid-template-columns:30% 23.5% 23.5% 23%;gap:.65%;padding:.18% 1.1% .35%}.panel,.smallbox,.meal,.sponsor-shell{background:linear-gradient(180deg,rgba(4,31,51,.97),rgba(1,19,33,.98));border:.18vw solid var(--gold);border-radius:.8vw;min-width:0;min-height:0;overflow:hidden}.panel{padding:.42vw .52vw}.section-title{text-align:center;color:#111;background:var(--gold);font-size:1.62vw;padding:.04vw .9vw .07vw;margin:-.08vw auto .22vw;width:max-content;max-width:94%;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);letter-spacing:.03vw;white-space:nowrap}
.hot-items,.dark-list,.candy-list,.breakfast-list{height:calc(100% - 2.18vw);display:grid;grid-auto-rows:minmax(0,1fr);--count:4;min-height:0}.hot-item,.dark-item,.candy-item{min-height:0}.hot-item{display:grid;grid-template-columns:28% minmax(0,1fr) auto;align-items:center;gap:.44vw;border-bottom:.08vw solid rgba(242,169,0,.65);padding:.06vw .12vw}.hot-item:last-child,.dark-item:last-child,.candy-item:last-child{border-bottom:0}.hot-item img{width:100%;height:100%;max-height:min(3.85vw,calc(20vw / var(--count)));object-fit:contain}.name{font-size:clamp(.68vw,calc(7vw / var(--count)),1.42vw);line-height:.92;min-width:0}.price,.meal-price{font-size:clamp(.88vw,calc(8.4vw / var(--count)),1.78vw);background:var(--gold);color:#111;line-height:1;padding:.06vw .36vw;clip-path:polygon(8% 0,100% 10%,92% 100%,0 90%);font-weight:900;white-space:nowrap}.hot-text{min-width:0}.hot-desc{font-family:Arial,sans-serif;font-size:clamp(.61vw,calc(3.3vw / var(--count)),.81vw);font-weight:700;line-height:1.07;margin-top:.10vw;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dark-item{display:grid;grid-template-columns:22% minmax(0,1fr) auto;align-items:center;gap:.40vw;border-bottom:.08vw dotted rgba(242,169,0,.9);padding:.08vw .04vw}.dark-item img{width:100%;height:100%;max-height:min(3.45vw,calc(16vw / var(--count)));object-fit:contain}.dark-item .name{font-size:clamp(.72vw,calc(5.25vw / var(--count)),1.20vw)}.desc{font-family:Arial,sans-serif;font-size:clamp(.59vw,calc(3.18vw / var(--count)),.78vw);font-weight:700;line-height:1.07;margin-top:.07vw;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.dark-item .price{font-size:clamp(.88vw,calc(6vw / var(--count)),1.48vw)}
.stack{display:grid;grid-template-rows:1fr .96fr;gap:.52vw;min-width:0;min-height:0}.stack>.panel{min-height:0}.candy-item{display:grid;grid-template-columns:25% minmax(0,1fr) auto;align-items:center;gap:.40vw;border-bottom:.08vw dotted rgba(242,169,0,.9);padding:.07vw .07vw}.candy-item img{width:100%;height:100%;max-height:min(3.9vw,calc(18vw / var(--count)));object-fit:contain}.candy-item .name{font-size:clamp(.74vw,calc(5.15vw / var(--count)),1.27vw)}.candy-text{min-width:0}.candy-desc{font-family:Arial,sans-serif;font-size:clamp(.66vw,calc(3.75vw / var(--count)),.90vw);font-weight:700;line-height:1.08;margin-top:.06vw;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.candy-item .price{font-size:clamp(.92vw,calc(6vw / var(--count)),1.52vw)}
.breakfast-list{--count:2}.stack .breakfast-list .dark-item img{max-height:min(2.75vw,calc(9.7vw / var(--count)))}.stack .breakfast-list .dark-item .name{font-size:clamp(.70vw,calc(4.55vw / var(--count)),1.12vw)}.stack .breakfast-list .desc{font-size:clamp(.60vw,calc(3.2vw / var(--count)),.76vw)}
.side{display:grid;grid-template-rows:minmax(0,1fr) auto auto;gap:.46vw;min-width:0;min-height:0}.smallbox{border-radius:.55vw}.smallbox h3{margin:0;background:var(--gold);color:#111;text-align:center;padding:.18vw .25vw;font-size:.91vw;line-height:1}.smallbox .inside{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:.33vw;padding:.24vw .40vw;font-family:Arial,sans-serif;font-weight:800;font-size:.67vw;line-height:1.06}.qr{width:3.35vw;height:3.35vw;background:#fff;padding:.12vw;object-fit:contain}.hidden{display:none!important}
.meals{display:grid;grid-template-columns:repeat(var(--meal-count,2),minmax(0,1fr));gap:.65%;padding:.12% 1.1% .32%;--meal-count:2}.meal{display:grid;grid-template-columns:27% minmax(0,1fr) 24%;align-items:center;gap:.40vw;padding:.30vw .48vw}.meal-name{font-size:clamp(.84vw,calc(3vw / var(--meal-count)),1.48vw);line-height:.92}.meal-price{display:inline-block;margin-top:.13vw;font-size:clamp(1.12vw,calc(3.7vw / var(--meal-count)),1.82vw)}.meal-desc{font-family:Arial,sans-serif;font-weight:900;font-size:clamp(.56vw,calc(1.58vw / var(--meal-count)),.75vw);line-height:1.07;text-transform:uppercase;color:var(--white);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.meal img{width:100%;height:clamp(3.35vw,calc(12vw / var(--meal-count)),5.9vw);object-fit:contain}
.sponsors{padding:.20% 1.1% .55%}.sponsor-shell{height:100%;display:grid;grid-template-columns:9% minmax(0,1fr) 9%;gap:.65vw;align-items:center;padding:.34vw .55vw}.sponsor-heading{text-align:center;color:var(--gold);font-size:1.08vw;line-height:.98}.sponsor-heading small{display:block;color:var(--white);font-family:Arial,sans-serif;font-size:.48vw;letter-spacing:.03vw;margin-top:.12vw}.sponsor-stage{height:100%;display:grid;grid-template-columns:1fr 1fr;gap:.72vw;min-width:0}.sponsor-card{display:grid;grid-template-columns:30% minmax(0,1fr);align-items:center;gap:.55vw;border:.07vw solid rgba(242,169,0,.62);border-radius:.45vw;background:rgba(255,255,255,.025);padding:.28vw .42vw;min-width:0;overflow:hidden}.sponsor-card img{width:100%;height:100%;max-height:5.5vw;object-fit:contain;background:#fff;border-radius:.24vw;padding:.14vw}.sponsor-info{min-width:0}.sponsor-kicker{color:var(--gold);font-size:.65vw;line-height:1;margin-bottom:.14vw}.sponsor-name{font-size:1.15vw;line-height:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.sponsor-message{font-family:Arial,sans-serif;color:var(--muted);font-weight:800;font-size:.59vw;line-height:1.08;margin-top:.11vw;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.sponsor-end{text-align:center;color:var(--gold);font-size:.88vw;line-height:1}.sponsor-end span{display:block;color:var(--white);font-family:Arial,sans-serif;font-size:.46vw;margin-top:.11vw}
@media(max-width:1100px){.board{border-width:6px}}
</style>
</head>
<body>
<div class="board">
  <header class="header">
    <img class="logo-left" src="assets/logo-left.png" alt="Kennedy Eagles logo">
    <div class="header-center"><div class="title-line"><span id="title"></span> <span id="subtitle" class="second"></span></div><div class="tagline" id="tagline"></div></div>
    <div class="support-top">ALL PROCEEDS SUPPORT<b>OUR FOOTBALL ATHLETES!</b></div>
  </header>
  <main class="main">
    <section class="panel"><div class="section-title">HOT FOOD</div><div id="hotFood" class="hot-items"></div></section>
    <section class="panel"><div class="section-title">DRINKS</div><div id="drinks" class="dark-list"></div></section>
    <div class="stack"><section class="panel"><div class="section-title">SNACKS</div><div id="snacks" class="dark-list"></div></section><section class="panel"><div class="section-title">BREAKFAST</div><div id="breakfast" class="dark-list breakfast-list"></div></section></div>
    <aside class="side"><section class="panel"><div class="section-title">CANDY</div><div id="candy" class="candy-list"></div></section><section class="smallbox" id="paymentBox"><h3>PAYMENT OPTIONS</h3><div class="inside"><div id="payments"></div><img id="paymentQr" class="qr hidden" alt="Payment QR"></div></section><section class="smallbox" id="programBox"><h3>GAME DAY PROGRAM</h3><div class="inside"><div id="programText"></div><img id="programQr" class="qr hidden" alt="Program QR"></div></section></aside>
  </main>
  <section class="meals" id="meals"></section>
  <section class="sponsors" id="sponsorRegion"><div class="sponsor-shell"><div class="sponsor-heading">THANK YOU<br>SPONSORS<small>KENNEDY FOOTBALL</small></div><div class="sponsor-stage"><div id="sponsorLeft" class="sponsor-card hidden"><img id="sponsorLeftLogo" alt="Sponsor logo"><div class="sponsor-info"><div class="sponsor-kicker">PROUD SPONSOR</div><div id="sponsorLeftName" class="sponsor-name"></div><div id="sponsorLeftMessage" class="sponsor-message"></div></div></div><div id="sponsorRight" class="sponsor-card hidden"><img id="sponsorRightLogo" alt="Sponsor logo"><div class="sponsor-info"><div class="sponsor-kicker">PROUD SPONSOR</div><div id="sponsorRightName" class="sponsor-name"></div><div id="sponsorRightMessage" class="sponsor-message"></div></div></div></div><div class="sponsor-end">COMMUNITY<span>PARTNERS</span></div></div></section>
</div>
<script>
function loadMenuData(){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='menu-data.js?v='+Date.now();s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
(async()=>{try{await loadMenuData()}catch(e){}
try{const q=localStorage.getItem('kennedyPreviewData');if(new URLSearchParams(location.search).has('preview')&&q)window.KENNEDY_MENU=JSON.parse(q)}catch(e){}
const d=window.KENNEDY_MENU||{};const $=id=>document.getElementById(id);
if((d.schemaVersion||0)<9){d.breakfast=Array.isArray(d.breakfast)?d.breakfast:[];d.snacks=Array.isArray(d.snacks)?d.snacks:[];const u=d.snacks.find(i=>/UNCRUSTABLE/i.test(i.name||''));if(u&&!d.breakfast.some(i=>/UNCRUSTABLE/i.test(i.name||''))){d.breakfast.push(u);d.snacks=d.snacks.filter(i=>i!==u)}if(!d.breakfast.some(i=>/DONUT/i.test(i.name||'')))d.breakfast.push({name:'DONUTS',price:'2',image:'assets/donuts.svg'});d.drinks=Array.isArray(d.drinks)?d.drinks:[];if(!d.drinks.some(i=>/COFFEE/i.test(i.name||'')))d.drinks.push({name:'COFFEE',price:'2',image:'assets/coffee.svg'});if(!d.drinks.some(i=>/RED BULL/i.test(i.name||'')))d.drinks.push({name:'RED BULL',price:'4',image:'assets/redbull.svg'});d.schemaVersion=9}
$('title').textContent=d.title||'KENNEDY';$('subtitle').textContent=d.subtitle||'CONCESSIONS';$('tagline').textContent=d.tagline||'GRAB A SNACK. CHEER LOUD. GO EAGLES!';
function available(items){return (items||[]).filter(i=>!i.outOfStock)}
function applyCount(el,count){el.style.setProperty('--count',Math.max(1,count));el.style.gridTemplateRows=`repeat(${Math.max(1,count)},minmax(0,1fr))`}
function hot(items){const list=available(items),el=$('hotFood');applyCount(el,list.length);el.innerHTML=list.map(i=>`<div class="hot-item"><img src="${esc(i.image||'')}" alt=""><div class="hot-text"><div class="name">${esc(i.name||'')}</div>${i.description?`<div class="hot-desc">${esc(i.description)}</div>`:''}</div><div class="price">$${esc(i.price||'')}</div></div>`).join('')}
function dark(id,items){const list=available(items),el=$(id);applyCount(el,list.length);el.innerHTML=list.map(i=>`<div class="dark-item"><img src="${esc(i.image||'')}" alt=""><div><div class="name">${esc(i.name||'')}</div>${i.description?`<div class="desc">${esc(i.description)}</div>`:''}</div><div class="price">$${esc(i.price||'')}</div></div>`).join('')}
function candy(items){const list=available(items),el=$('candy');applyCount(el,list.length);el.innerHTML=list.map(i=>`<div class="candy-item"><img src="${esc(i.image||'')}" alt=""><div class="candy-text"><div class="name">${esc(i.name||'')}</div>${i.description?`<div class="candy-desc">${esc(i.description)}</div>`:''}</div><div class="price">$${esc(i.price||'')}</div></div>`).join('')}
function meals(items){const list=available(items).slice(0,3),el=$('meals');el.style.setProperty('--meal-count',Math.max(1,list.length));el.innerHTML=list.map(i=>`<section class="meal"><div><div class="meal-name">${esc(i.name||'')}</div><div class="meal-price">$${esc(i.price||'')}</div></div><div class="meal-desc">INCLUDES:<br>${esc(i.description||'')}</div><img src="${esc(i.image||'')}" alt=""></section>`).join('')}
hot(d.hotFood);dark('drinks',d.drinks);dark('snacks',d.snacks);dark('breakfast',d.breakfast);candy(d.candy);meals(d.meals);
$('payments').textContent=d.payments||'';$('programText').textContent=d.programText||'';$('paymentBox').classList.toggle('hidden',d.showPayments===false);$('programBox').classList.toggle('hidden',d.showProgram===false);if(d.paymentQr){$('paymentQr').src=d.paymentQr;$('paymentQr').classList.remove('hidden')}if(d.programQr){$('programQr').src=d.programQr;$('programQr').classList.remove('hidden')}
const sponsorList=(Array.isArray(d.sponsors)?d.sponsors:[]).filter(s=>s&&s.active!==false&&(s.name||s.image));const region=$('sponsorRegion');
if(d.showSponsors===false||!sponsorList.length){region.classList.add('hidden')}else{region.classList.remove('hidden');const fill=(side,sp)=>{const box=$(side),logo=$(side+'Logo'),name=$(side+'Name'),msg=$(side+'Message');if(!sp){box.classList.add('hidden');return}box.classList.remove('hidden');name.textContent=sp.name||'Community Sponsor';msg.textContent=sp.message||'';if(sp.image){logo.src=sp.image;logo.classList.remove('hidden')}else{logo.removeAttribute('src');logo.classList.add('hidden')}};let pair=0;const show=()=>{const start=(pair*2)%sponsorList.length;fill('sponsorLeft',sponsorList[start]);fill('sponsorRight',sponsorList[start+1]||null)};show();if(sponsorList.length>2){const seconds=Math.max(3,Math.min(60,Number(d.sponsorRotationSeconds)||10));setInterval(()=>{pair=(pair+1)%Math.ceil(sponsorList.length/2);show()},seconds*1000)}}
})();
</script>
</body></html>
