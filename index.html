<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kennedy Concessions</title>
<style>
:root{--navy:#021526;--navy2:#06223a;--gold:#f2a900;--gold2:#ffc400;--white:#f7f3ea;--muted:#dbe5ef}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}body{display:flex;align-items:center;justify-content:center;font-family:Impact,Haettenschweiler,'Arial Narrow Bold',Arial,sans-serif;color:var(--white)}
.board{position:relative;width:min(100vw,177.7778vh);aspect-ratio:16/9;background:radial-gradient(circle at 50% -15%,#0b3758 0,#031d31 33%,#01111e 72%,#000b13 100%);overflow:hidden;display:grid;grid-template-rows:20.5% 58.5% 15.5% 5.5%;border:10px solid #02080d}
.board:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,.02),transparent 20%,transparent 80%,rgba(255,255,255,.02));z-index:0}.header,.main,.meals,.footer{position:relative;z-index:1;min-width:0;min-height:0}
.lights{position:absolute;top:2.2%;width:8.2%;height:8%;opacity:.95;filter:drop-shadow(0 0 12px #d9f3ff);z-index:2;background:radial-gradient(circle,#fff 0 18%,transparent 22%) 0 0/33% 50%}.lights.left{left:2%}.lights.right{right:2%}
.logo{position:absolute;top:2.8%;width:8.2%;height:13%;object-fit:contain;z-index:3}.logo.left{left:7.5%}.logo.right{right:7.5%}
.header{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-top:.4%}.title{font-size:5.2vw;max-font-size:96px;letter-spacing:.18vw;color:var(--gold);-webkit-text-stroke:.11vw #fff;text-shadow:0 .2vw 0 #5d3300,0 .38vw .6vw #000;line-height:.78}.subtitle{font-size:4.4vw;letter-spacing:.1vw;color:#f3efe8;text-shadow:0 .28vw 0 #111;line-height:.82;margin-top:.2%}.tagline{margin-top:.7%;min-width:42%;max-width:70%;background:linear-gradient(90deg,transparent 0,var(--gold) 10%,var(--gold2) 50%,var(--gold) 90%,transparent 100%);color:#111;padding:.35% 4%;font-size:1.45vw;letter-spacing:.04vw;white-space:nowrap}
.main{display:grid;grid-template-columns:30% 23.5% 23.5% 23%;gap:.65%;padding:.2% 1.1% .35%}.panel,.smallbox,.meal{background:linear-gradient(180deg,rgba(4,31,51,.97),rgba(1,19,33,.98));border:.18vw solid var(--gold);border-radius:.8vw;min-width:0;min-height:0;overflow:hidden}.panel{padding:.45vw .55vw}.section-title{text-align:center;color:#111;background:var(--gold);font-size:1.75vw;padding:.05vw .9vw .08vw;margin:-.1vw auto .28vw;width:max-content;max-width:94%;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);letter-spacing:.03vw;white-space:nowrap}
.items{height:calc(100% - 2.4vw);display:grid;min-height:0}.hot-items{height:100%;display:grid;grid-template-rows:repeat(5,minmax(0,1fr))}.hot-item,.dark-item,.candy-item{min-height:0}.hot-item{display:grid;grid-template-columns:28% minmax(0,1fr) auto;align-items:center;gap:.45vw;border-bottom:.09vw solid rgba(242,169,0,.65);padding:.08vw .15vw}.hot-item:last-child,.dark-item:last-child,.candy-item:last-child{border-bottom:0}.hot-item img{width:100%;height:100%;max-height:4.4vw;object-fit:contain}.name{font-size:1.55vw;line-height:.92;min-width:0}.price{font-size:1.95vw;color:var(--gold);line-height:1}.hot-item .price{background:var(--gold);color:#111;padding:.06vw .38vw;clip-path:polygon(8% 0,100% 10%,92% 100%,0 90%)}
.dark-list{height:calc(100% - 2.4vw);display:grid;grid-auto-rows:minmax(0,1fr)}.dark-item{display:grid;grid-template-columns:22% minmax(0,1fr) auto;align-items:center;gap:.42vw;border-bottom:.09vw dotted rgba(242,169,0,.9);padding:.1vw .05vw}.dark-item img{width:100%;height:100%;max-height:3.65vw;object-fit:contain}.dark-item .name{font-size:1.25vw}.desc{font-family:Arial,sans-serif;font-size:.62vw;font-weight:700;line-height:1.08;margin-top:.1vw;color:var(--muted)}.dark-item .price{font-size:1.55vw}.stack{display:grid;grid-template-rows:1fr .96fr;gap:.55vw;min-width:0;min-height:0}.stack>.panel{min-height:0}.candy-visual{height:2.7vw;width:100%;object-fit:contain;margin:-.1vw 0 .05vw}.candy-list{height:calc(100% - 5.1vw);display:grid;grid-auto-rows:minmax(0,1fr)}.candy-item{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;border-bottom:.09vw dotted rgba(242,169,0,.9);padding:.04vw .1vw}.candy-item .name{font-size:1.2vw}.candy-item .price{font-size:1.45vw}
.side{display:grid;grid-template-rows:minmax(0,1fr) auto auto;gap:.5vw;min-width:0;min-height:0}.fuel{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:.55vw}.fuel strong{font-size:1.45vw;color:var(--gold);border-bottom:.11vw solid var(--gold);padding-bottom:.2vw;margin-bottom:.3vw}.fuel img{width:42%;height:4.9vw;object-fit:contain;margin:.05vw 0}.fuel span{font-family:Arial,sans-serif;font-weight:800;font-size:.78vw;line-height:1.1}.smallbox{border-radius:.6vw}.smallbox h3{margin:0;background:var(--gold);color:#111;text-align:center;padding:.2vw .25vw;font-size:.95vw;line-height:1}.smallbox .inside{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:.35vw;padding:.28vw .45vw;font-family:Arial,sans-serif;font-weight:800;font-size:.7vw;line-height:1.08}.qr{width:3.6vw;height:3.6vw;background:#fff;padding:.14vw;object-fit:contain}.hidden{display:none!important}
.meals{display:grid;grid-template-columns:1fr 1fr;gap:.65%;padding:.05% 1.1% .25%}.meal{display:grid;grid-template-columns:30% minmax(0,1fr) 25%;align-items:center;gap:.55vw;padding:.4vw .65vw}.meal-name{font-size:1.65vw;line-height:.9}.meal-price{display:inline-block;margin-top:.2vw;font-size:2.1vw;color:#111;background:var(--gold);padding:.05vw .6vw;line-height:1}.meal-desc{font-family:Arial,sans-serif;font-weight:900;font-size:.67vw;line-height:1.05;text-transform:uppercase;color:var(--white)}.meal img{width:100%;height:6.8vw;object-fit:contain}.footer{display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.35vw;font-style:italic;letter-spacing:.03vw}.footer b{color:var(--gold);margin-left:.35vw}
@media (max-width:1100px){.board{border-width:6px}.title{font-size:5.2vw}.subtitle{font-size:4.4vw}}
</style>
</head>
<body>
<div class="board">
  <div class="lights left"></div><div class="lights right"></div>
  <img class="logo left" src="assets/logo-left.png" alt="Kennedy Eagles logo"><img class="logo right" src="assets/logo-left.png" alt="Kennedy Eagles logo">
  <div class="header"><div class="title" id="title"></div><div class="subtitle" id="subtitle"></div><div class="tagline" id="tagline"></div></div>
  <div class="main">
    <section class="panel"><div class="section-title">HOT FOOD</div><div id="hotFood" class="hot-items"></div></section>
    <section class="panel"><div class="section-title">DRINKS</div><div id="drinks" class="dark-list"></div></section>
    <div class="stack"><section class="panel"><div class="section-title">SNACKS</div><div id="snacks" class="dark-list"></div></section><section class="panel"><div class="section-title">CANDY</div><img src="assets/candy.png" class="candy-visual" alt="Candy"><div id="candy" class="candy-list"></div></section></div>
    <aside class="side"><section class="panel fuel"><strong>GAME DAY FUEL</strong><img src="assets/helmet.png" alt="Kennedy football helmet"><span>THANK YOU FOR SUPPORTING<br>KENNEDY FOOTBALL!</span></section><section class="smallbox" id="paymentBox"><h3>PAYMENT OPTIONS</h3><div class="inside"><div id="payments"></div><img id="paymentQr" class="qr hidden" alt="Payment QR"></div></section><section class="smallbox" id="programBox"><h3>GAME DAY PROGRAM</h3><div class="inside"><div id="programText"></div><img id="programQr" class="qr hidden" alt="Program QR"></div></section></aside>
  </div>
  <div class="meals" id="meals"></div>
  <div class="footer" id="footer"></div>
</div>
<script>
function loadMenuData(){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='menu-data.js?v='+Date.now();s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
(async()=>{try{await loadMenuData()}catch(e){}
try{const q=localStorage.getItem('kennedyPreviewData');if(new URLSearchParams(location.search).has('preview')&&q)window.KENNEDY_MENU=JSON.parse(q)}catch(e){}
const d=window.KENNEDY_MENU||{};const $=id=>document.getElementById(id);
$('title').textContent=d.title||'KENNEDY';$('subtitle').textContent=d.subtitle||'CONCESSIONS';$('tagline').textContent=d.tagline||'';
const footer=d.footer||'ALL PROCEEDS SUPPORT OUR FOOTBALL ATHLETES!';$('footer').innerHTML=esc(footer).replace(/(OUR FOOTBALL ATHLETES!)/i,'<b>$1</b>');
function hot(items){$('hotFood').innerHTML=(items||[]).slice(0,5).map(i=>`<div class="hot-item"><img src="${esc(i.image||'')}" alt=""><div class="name">${esc(i.name||'')}</div><div class="price">$${esc(i.price||'')}</div></div>`).join('')}
function dark(id,items){$(id).innerHTML=(items||[]).slice(0,5).map(i=>`<div class="dark-item"><img src="${esc(i.image||'')}" alt=""><div><div class="name">${esc(i.name||'')}</div>${i.description?`<div class="desc">${esc(i.description)}</div>`:''}</div><div class="price">$${esc(i.price||'')}</div></div>`).join('')}
function candy(items){$('candy').innerHTML=(items||[]).slice(0,4).map(i=>`<div class="candy-item"><div class="name">${esc(i.name||'')}</div><div class="price">$${esc(i.price||'')}</div></div>`).join('')}
function meals(items){$('meals').innerHTML=(items||[]).slice(0,2).map(i=>`<section class="meal"><div><div class="meal-name">${esc(i.name||'')}</div><div class="meal-price">$${esc(i.price||'')}</div></div><div class="meal-desc">INCLUDES:<br>${esc(i.description||'')}</div><img src="${esc(i.image||'')}" alt=""></section>`).join('')}
hot(d.hotFood);dark('drinks',d.drinks);dark('snacks',d.snacks);candy(d.candy);meals(d.meals);
$('payments').textContent=d.payments||'';$('programText').textContent=d.programText||'';$('paymentBox').classList.toggle('hidden',d.showPayments===false);$('programBox').classList.toggle('hidden',d.showProgram===false);
if(d.paymentQr){$('paymentQr').src=d.paymentQr;$('paymentQr').classList.remove('hidden')}if(d.programQr){$('programQr').src=d.programQr;$('programQr').classList.remove('hidden')}
})();
</script>
</body></html>
